name: Test and publish CzyToSciema
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: czytosciema-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit
      - run: node scripts/update-threats.mjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: github.event_name != 'schedule'
      - name: Browser, image, accessibility and offline tests
        if: github.event_name != 'schedule'
        run: |
          pnpm preview > /tmp/czytosciema-preview.log 2>&1 &
          node scripts/browser-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'schedule'
        with:
          name: browser-test-evidence
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested build
        id: deployment
        uses: actions/deploy-pages@v4
